[package]
name = "gpui-notion"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = { version = "0.6.1", features = ["tree-sitter-languages"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1"
unicode-segmentation = "1"
regex = "1.13.1"

[dev-dependencies]
gpui-kit = { version = "0.6.1", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
